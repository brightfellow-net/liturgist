name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.14.0 }
      - run: scripts/check-license.sh
      - run: go test -race ./...
        env: { LITURGIST_TEST_POSTGRES: "1" }
      - run: GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/liturgist
      - run: GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/liturgist
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: make gen && git diff --exit-code
      - run: pnpm -r lint && pnpm -r test && pnpm --filter web build
