name: release
# A v* tag publishes the archives, checksums.txt and the Docker image, and
# signs checksums.txt and the image with cosign (keyless: GitHub's OIDC token,
# no key to keep). Verification steps are in docs/self-host/upgrading.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  packages: write # ghcr.io
  id-token: write # cosign keyless

env:
  IMAGE: ghcr.io/brightfellow-net/liturgist

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - run: go test ./...
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums.txt
        run: |
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          gh release upload "$GITHUB_REF_NAME" dist/checksums.txt.sigstore.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          v="${GITHUB_REF_NAME#v}"
          t="$IMAGE:$v"
          case "$v" in *-*) ;; *) t="$t,$IMAGE:latest" ;; esac # no "latest" for a pre-release
          echo "list=$t" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
      - name: Sign the image
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
